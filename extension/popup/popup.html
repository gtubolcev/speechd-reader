<!doctype html>
<html lang="">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="row">
  <button id="auto" class="main" data-i18n-title="popReadTitle" data-i18n="popRead"></button>
  <button id="pause" data-i18n-title="popPause" disabled>⏸</button>
  <button id="stop" data-i18n-title="popStop" disabled>⏹</button>
  <button id="pin" data-i18n-title="popPin">📌</button>
</div>
<button id="pick" class="wide" data-i18n-title="popPickTitle" data-i18n="popPick"></button>
<button id="page" class="wide" data-i18n-title="popPageTitle" data-i18n="popPage"></button>
<label class="field"><span data-i18n="popLang"></span>
  <select id="lang">
    <option value="" data-i18n="popLangAuto"></option>
  </select>
</label>
<label class="field"><span data-i18n="popSpeed"></span>
  <input id="rate" type="range" min="-100" max="100" step="5">
  <span id="rate-value"></span>
</label>
<label class="check"><input id="rate-default" type="checkbox"> <span data-i18n="popSpeedDefault"></span></label>
<label class="check"><input id="buttons" type="checkbox"> <span data-i18n="popButtons"></span></label>
<p id="status" role="status"></p>
<script src="popup.js"></script>
</body>
</html>
